[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-asset-alpha"
version = "0.1.0"
description = "Cross-asset (US equities + crypto) alpha discovery & portfolio assembly (Task A)"
requires-python = ">=3.12"
# Dependencies are single-sourced from requirements.txt (no second copy to drift).
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# `src` and `scripts` are both import packages (`import src.config`, `from scripts.trend...`).
# Editable-install (`pip install -e .`) so modules import cleanly without a `sys.path.insert` bootstrap.
[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

# Dev-only tooling (not needed to run the pipeline): `pip install -e ".[dev]"`.
[project.optional-dependencies]
dev = ["ruff==0.16.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Curated, high-signal gate: pyflakes (unused imports/undefined names, redefinitions, bad f-strings)
# plus syntax errors. Stylistic rulesets are deliberately off — this is research code where import
# placement is intentional (matplotlib.use()/warnings config must precede the `src.*` imports, hence
# the `# noqa: E402` breadcrumbs). `make lint` runs this.
select = ["F", "E9"]
ignore = ["F841"]  # unused locals: mostly intentional tuple-unpacking (a, _ = f()); left for readability
